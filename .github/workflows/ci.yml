name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Validate browser JavaScript
        run: node --check assets/app.js

      - name: Validate example presentations
        run: |
          cargo run --locked -- validate examples/intro-to-rust.md
          cargo run --locked -- validate examples/kitchen-sink.md

  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Coolify application
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'https://admin.corrode.dev' }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          COOLIFY_TOKEN="${COOLIFY_TOKEN//[[:space:]]/}"
          COOLIFY_TOKEN="${COOLIFY_TOKEN#Bearer}"
          if [ -z "${COOLIFY_TOKEN}" ] || [ -z "${ADMIN_TOKEN}" ] || [ -z "${COOLIFY_RESOURCE_UUID}" ]; then
            echo "The COOLIFY_TOKEN and ADMIN_TOKEN secrets and COOLIFY_RESOURCE_UUID variable are required." >&2
            exit 1
          fi

          api_get() {
            curl "${COOLIFY_BASE_URL}/api/v1${1}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent
          }

          api_send() {
            curl --request "${1}" "${COOLIFY_BASE_URL}/api/v1${2}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "${3}" \
              --fail-with-body \
              --show-error \
              --silent
          }

          environment_variables="$(api_get "/applications/${COOLIFY_RESOURCE_UUID}/envs")"
          upsert_env() {
            local key="${1}"
            local payload="${2}"
            local method="POST"
            if jq --exit-status --arg key "${key}" \
              'any(.[]; .key == $key and (.is_preview // false) == false)' \
              <<<"${environment_variables}" >/dev/null; then
              method="PATCH"
            fi
            api_send "${method}" "/applications/${COOLIFY_RESOURCE_UUID}/envs" "${payload}" >/dev/null
            echo "Configured ${key}."
          }

          admin_env="$(jq --null-input --arg value "${ADMIN_TOKEN}" \
            '{key: "SLIDES_ADMIN_PASSWORD", value: $value, is_preview: false, is_literal: true}')"
          upsert_env SLIDES_ADMIN_PASSWORD "${admin_env}"
          upsert_env SLIDES_SECURE_COOKIES \
            '{"key":"SLIDES_SECURE_COOKIES","value":"true","is_preview":false,"is_literal":true}'

          storages="$(api_get "/applications/${COOLIFY_RESOURCE_UUID}/storages")"
          if jq --exit-status \
            'any(.. | objects; .mount_path? == "/app/data")' \
            <<<"${storages}" >/dev/null; then
            echo "Persistent storage is mounted at /app/data."
          elif jq --exit-status \
            'any(.. | objects; .name? == "slides-data")' \
            <<<"${storages}" >/dev/null; then
            echo "The slides-data volume exists but is not mounted at /app/data." >&2
            exit 1
          else
            api_send POST "/applications/${COOLIFY_RESOURCE_UUID}/storages" \
              '{"type":"persistent","name":"slides-data","mount_path":"/app/data"}' >/dev/null
            echo "Created slides-data storage at /app/data."
          fi

      - name: Deploy and wait for Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'https://admin.corrode.dev' }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          COOLIFY_TOKEN="${COOLIFY_TOKEN//[[:space:]]/}"
          COOLIFY_TOKEN="${COOLIFY_TOKEN#Bearer}"

          response="$(curl --request POST \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            --fail-with-body \
            --show-error \
            --silent)"
          deployment_uuid="$(jq --exit-status --raw-output '.deployments[0].deployment_uuid' <<<"${response}")"

          for _ in {1..120}; do
            deployment="$(curl \
              "${COOLIFY_BASE_URL}/api/v1/deployments/${deployment_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent)"
            status="$(jq --exit-status --raw-output '.status' <<<"${deployment}")"
            echo "Coolify deployment ${deployment_uuid}: ${status}"

            case "${status}" in
              finished)
                exit 0
                ;;
              failed|cancelled-by-user)
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Coolify deployment ${deployment_uuid}." >&2
          exit 1

      - name: Verify production health
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || 'https://slides.corrode.dev/healthz' }}
        run: >-
          curl
          --fail
          --show-error
          --silent
          --retry 24
          --retry-delay 5
          --retry-all-errors
          --retry-max-time 120
          --max-time 10
          "${DEPLOY_HEALTHCHECK_URL}"

      - name: Publish the Intro to Rust deck
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SLIDES_BASE_URL: https://slides.corrode.dev
        shell: bash
        run: |
          set -euo pipefail

          cookie_jar="$(mktemp)"
          trap 'rm -f "${cookie_jar}"' EXIT

          curl "${SLIDES_BASE_URL}/admin/login" \
            --request POST \
            --data-urlencode "password=${ADMIN_TOKEN}" \
            --cookie-jar "${cookie_jar}" \
            --fail \
            --show-error \
            --silent \
            --output /dev/null

          if ! grep --quiet 'slides_admin' "${cookie_jar}"; then
            echo "Production admin login did not set the expected session cookie." >&2
            exit 1
          fi

          editor_status="$(curl "${SLIDES_BASE_URL}/admin/decks/intro-to-rust/edit" \
            --cookie "${cookie_jar}" \
            --output /dev/null \
            --show-error \
            --silent \
            --write-out '%{http_code}')"
          if [ "${editor_status}" = "404" ]; then
            curl "${SLIDES_BASE_URL}/admin/decks" \
              --request POST \
              --cookie "${cookie_jar}" \
              --data-urlencode "title=Intro to Rust" \
              --data-urlencode "slug=intro-to-rust" \
              --fail \
              --show-error \
              --silent \
              --output /dev/null
          elif [ "${editor_status}" != "200" ]; then
            echo "Unexpected editor response: HTTP ${editor_status}." >&2
            exit 1
          fi

          curl "${SLIDES_BASE_URL}/admin/decks/intro-to-rust/publish" \
            --request POST \
            --cookie "${cookie_jar}" \
            --data-urlencode "title=Intro to Rust" \
            --data-urlencode "source@examples/intro-to-rust.md" \
            --data-urlencode "headline_font=inter" \
            --data-urlencode "text_font=inter" \
            --data-urlencode "code_font=jetbrains-mono" \
            --data-urlencode "background=#1e1e2e" \
            --data-urlencode "text=#cdd6f4" \
            --data-urlencode "accent=#f9e2af" \
            --fail \
            --show-error \
            --silent \
            --output /dev/null
          echo "Published the Intro to Rust deck."
