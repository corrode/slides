name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find or provision Coolify application
        id: coolify
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'https://admin.corrode.dev' }}
          COOLIFY_RECREATE_RESOURCE: ${{ vars.COOLIFY_RECREATE_RESOURCE }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          COOLIFY_TOKEN="${COOLIFY_TOKEN//[[:space:]]/}"
          COOLIFY_TOKEN="${COOLIFY_TOKEN#Bearer}"
          if [ -z "${COOLIFY_TOKEN}" ] || [ -z "${ADMIN_TOKEN}" ]; then
            echo "The COOLIFY_TOKEN and ADMIN_TOKEN repository secrets are required." >&2
            exit 1
          fi

          api_get() {
            curl "${COOLIFY_BASE_URL}/api/v1${1}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent
          }

          api_send() {
            curl --request "${1}" "${COOLIFY_BASE_URL}/api/v1${2}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "${3}" \
              --fail-with-body \
              --show-error \
              --silent
          }

          app_uuid="${COOLIFY_RESOURCE_UUID}"
          if [ -z "${app_uuid}" ]; then
            applications="$(api_get /applications)"
            app_uuid="$(jq --raw-output \
              '[.[] | select((.domains // .fqdn // "") | contains("slides.corrode.dev"))] | if length == 1 then .[0].uuid else empty end' \
              <<<"${applications}")"
          fi

          if [ -n "${app_uuid}" ] && [ "${COOLIFY_RECREATE_RESOURCE}" = "true" ]; then
            if ! timeout 60 docker manifest inspect "${IMAGE_NAME}:latest" >/dev/null; then
              echo "${IMAGE_NAME}:latest is not anonymously pullable; refusing to replace the live application." >&2
              exit 1
            fi

            curl --request DELETE \
              "${COOLIFY_BASE_URL}/api/v1/applications/${app_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent >/dev/null
            echo "Removed the incomplete Coolify application ${app_uuid}."
            app_uuid=""
          fi

          if [ -z "${app_uuid}" ]; then
            servers="$(api_get /servers)"
            server_uuid="$(jq --raw-output \
              '[.[] | select(.name == "corrode1" or .ip == "46.225.7.147")] | if length == 1 then .[0].uuid elif length == 0 and ($servers | length) == 1 then $servers[0].uuid else empty end' \
              --argjson servers "${servers}" <<<"${servers}")"
            if [ -z "${server_uuid}" ]; then
              echo "Could not identify corrode1 uniquely in the Coolify server list." >&2
              jq '[.[] | {name, ip, uuid}]' <<<"${servers}"
              exit 1
            fi

            projects="$(api_get /projects)"
            project_uuid="$(jq --raw-output \
              '[.[] | select((.name | ascii_downcase) == "slides")] | if length == 1 then .[0].uuid else empty end' \
              <<<"${projects}")"
            if [ -z "${project_uuid}" ]; then
              project="$(api_send POST /projects '{"name":"Slides","description":"Interactive presentation server"}')"
              project_uuid="$(jq --exit-status --raw-output '.uuid' <<<"${project}")"
              echo "Created Coolify project ${project_uuid}."
            fi

            environments="$(api_get "/projects/${project_uuid}/environments")"
            environment_uuid="$(jq --raw-output \
              '[.[] | select(.name == "production")] | if length == 1 then .[0].uuid else empty end' \
              <<<"${environments}")"
            if [ -z "${environment_uuid}" ]; then
              environment="$(api_send POST "/projects/${project_uuid}/environments" '{"name":"production"}')"
              environment_uuid="$(jq --exit-status --raw-output '.uuid' <<<"${environment}")"
            fi

            create_payload="$(jq --null-input \
              --arg project "${project_uuid}" \
              --arg environment "${environment_uuid}" \
              --arg server "${server_uuid}" \
              '{
                project_uuid: $project,
                environment_name: "production",
                environment_uuid: $environment,
                server_uuid: $server,
                docker_registry_image_name: "ghcr.io/corrode/slides",
                docker_registry_image_tag: "latest",
                ports_exposes: "3000",
                custom_docker_run_options: "--mount type=volume,source=slides-data,target=/app/data",
                name: "slides",
                description: "Interactive presentation server",
                domains: "https://slides.corrode.dev",
                health_check_enabled: true,
                health_check_path: "/healthz",
                health_check_port: "3000",
                health_check_method: "GET",
                health_check_return_code: 200,
                health_check_scheme: "http",
                instant_deploy: false
              }')"
            application="$(api_send POST /applications/dockerimage "${create_payload}")"
            app_uuid="$(jq --exit-status --raw-output '.uuid' <<<"${application}")"
            echo "Created Coolify application ${app_uuid}."
          fi

          environment_variables="$(api_get "/applications/${app_uuid}/envs")"
          upsert_env() {
            local key="${1}"
            local payload="${2}"
            local method="POST"
            if jq --exit-status --arg key "${key}" \
              'any(.[]; .key == $key and (.is_preview // false) == false)' \
              <<<"${environment_variables}" >/dev/null; then
              method="PATCH"
            fi
            api_send "${method}" "/applications/${app_uuid}/envs" "${payload}" >/dev/null
            echo "Configured ${key}."
          }

          admin_env="$(jq --null-input --arg value "${ADMIN_TOKEN}" \
            '{key: "SLIDES_ADMIN_PASSWORD", value: $value, is_preview: false, is_literal: true}')"
          upsert_env SLIDES_ADMIN_PASSWORD "${admin_env}"
          upsert_env SLIDES_SECURE_COOKIES \
            '{"key":"SLIDES_SECURE_COOKIES","value":"true","is_preview":false,"is_literal":true}'

          echo "resource_uuid=${app_uuid}" >>"${GITHUB_OUTPUT}"
          echo "Coolify application UUID: ${app_uuid}"

      - name: Deploy and wait for Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL || 'https://admin.corrode.dev' }}
          COOLIFY_RESOURCE_UUID: ${{ steps.coolify.outputs.resource_uuid }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          COOLIFY_TOKEN="${COOLIFY_TOKEN//[[:space:]]/}"
          COOLIFY_TOKEN="${COOLIFY_TOKEN#Bearer}"

          response="$(curl --request POST \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            --fail-with-body \
            --show-error \
            --silent)"
          deployment_uuid="$(jq --exit-status --raw-output '.deployments[0].deployment_uuid' <<<"${response}")"

          for _ in {1..120}; do
            deployment="$(curl \
              "${COOLIFY_BASE_URL}/api/v1/deployments/${deployment_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent)"
            status="$(jq --exit-status --raw-output '.status' <<<"${deployment}")"
            echo "Coolify deployment ${deployment_uuid}: ${status}"

            case "${status}" in
              finished)
                exit 0
                ;;
              failed|cancelled-by-user)
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Coolify deployment ${deployment_uuid}." >&2
          exit 1

      - name: Verify production health
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL || 'https://slides.corrode.dev/healthz' }}
        run: >-
          curl
          --fail
          --show-error
          --silent
          --retry 24
          --retry-delay 5
          --retry-all-errors
          --retry-max-time 120
          --max-time 10
          "${DEPLOY_HEALTHCHECK_URL}"

      - name: Seed the Intro to Rust deck
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SLIDES_BASE_URL: https://slides.corrode.dev
        shell: bash
        run: |
          set -euo pipefail

          cookie_jar="$(mktemp)"
          trap 'rm -f "${cookie_jar}"' EXIT

          curl "${SLIDES_BASE_URL}/admin/login" \
            --request POST \
            --data-urlencode "password=${ADMIN_TOKEN}" \
            --cookie-jar "${cookie_jar}" \
            --fail \
            --show-error \
            --silent \
            --output /dev/null

          if ! grep --quiet 'slides_admin' "${cookie_jar}"; then
            echo "Production admin login did not set the expected session cookie." >&2
            exit 1
          fi

          editor_status="$(curl "${SLIDES_BASE_URL}/admin/decks/intro-to-rust/edit" \
            --cookie "${cookie_jar}" \
            --output /dev/null \
            --show-error \
            --silent \
            --write-out '%{http_code}')"
          if [ "${editor_status}" = "404" ]; then
            curl "${SLIDES_BASE_URL}/admin/decks" \
              --request POST \
              --cookie "${cookie_jar}" \
              --data-urlencode "title=Intro to Rust" \
              --data-urlencode "slug=intro-to-rust" \
              --fail \
              --show-error \
              --silent \
              --output /dev/null
          elif [ "${editor_status}" != "200" ]; then
            echo "Unexpected editor response: HTTP ${editor_status}." >&2
            exit 1
          fi

          curl "${SLIDES_BASE_URL}/admin/decks/intro-to-rust/publish" \
            --request POST \
            --cookie "${cookie_jar}" \
            --data-urlencode "title=Intro to Rust" \
            --data-urlencode "source@examples/intro-to-rust.md" \
            --data-urlencode "font=system" \
            --data-urlencode "background=#1e1e2e" \
            --data-urlencode "text=#cdd6f4" \
            --data-urlencode "accent=#f9e2af" \
            --fail \
            --show-error \
            --silent \
            --output /dev/null
          echo "Published the Intro to Rust deck."
