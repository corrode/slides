name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: image
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.COOLIFY_RESOURCE_UUID != ''
    steps:
      - name: Deploy and wait for Coolify
        env:
          COOLIFY_BASE_URL: ${{ vars.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "The COOLIFY_TOKEN repository secret is not configured." >&2
            exit 1
          fi

          COOLIFY_BASE_URL="${COOLIFY_BASE_URL:-https://admin.corrode.dev}"
          response="$(curl --request POST \
            "${COOLIFY_BASE_URL}/api/v1/deploy?uuid=${COOLIFY_RESOURCE_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            --fail-with-body \
            --show-error \
            --silent)"
          deployment_uuid="$(jq --exit-status --raw-output '.deployments[0].deployment_uuid' <<<"${response}")"

          for _ in {1..60}; do
            deployment="$(curl \
              "${COOLIFY_BASE_URL}/api/v1/deployments/${deployment_uuid}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              --fail-with-body \
              --show-error \
              --silent)"
            status="$(jq --exit-status --raw-output '.status' <<<"${deployment}")"
            echo "Coolify deployment ${deployment_uuid}: ${status}"

            case "${status}" in
              finished)
                exit 0
                ;;
              failed|cancelled-by-user)
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Coolify deployment ${deployment_uuid}." >&2
          exit 1

      - name: Verify production health
        if: vars.DEPLOY_HEALTHCHECK_URL != ''
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: >-
          curl
          --fail
          --show-error
          --silent
          --retry 24
          --retry-delay 5
          --retry-all-errors
          --retry-max-time 120
          --max-time 10
          "${DEPLOY_HEALTHCHECK_URL}"
