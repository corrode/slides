<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · PDF preview</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body class="printable-page" data-print-deck data-presentation-theme style="{{ theme_style }}">
  <header class="print-toolbar">
    <strong>{{ title }}</strong>
    <button type="button" data-print-now><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg>Print or save as PDF</button>
  </header>
  <main class="print-deck">{{ slides|safe }}</main>
</body>
</html>
