<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Session archive</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body class="archive-page" style="{{ theme_style }}">
  <header class="archive-toolbar">
    <div>
      <span class="status-pill success">Session archive</span>
      <strong>{{ title }}</strong>
    </div>
    <nav aria-label="Archive downloads">
      <a class="button secondary small" href="audience-input.json" download>Audience data</a>
      <a class="button small" href="download">Download ZIP</a>
    </nav>
  </header>
  <main class="archive-deck">{{ slides|safe }}</main>
  <footer class="archive-note">
    <strong>About this archive</strong>
    <p>Results show the final stored responses and all reactions. Raised hands show only those still raised when the session ended; overwritten answers and earlier hand activity were not retained.</p>
  </footer>
</body>
</html>
