<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Present {{ title }} · Slides</title>
  <script src="/assets/theme.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js" defer></script>
  <script src="/assets/hx-sse.min.js" defer></script>
  {% if has_mermaid %}
  <script src="/assets/vendor/mermaid/mermaid.min.js" defer></script>
  {% endif %}
  <script src="/assets/app.js" defer></script>
</head>
<body class="live-page" data-presentation-theme data-live-connection="connecting" style="{{ theme_style }}">
  <div data-live-transport hx-sse:connect="/sessions/{{ code }}/events?view=presenter" hx-target="#live-view" hx-swap="outerMorph"></div>
  <p id="live-announcer" class="visually-hidden" role="status" aria-live="polite"></p>
  <div id="live-transport-error" role="alert" aria-live="assertive"></div>
  <div id="reaction-feed" class="reaction-feed" aria-hidden="true"></div>
  {{ initial_live|safe }}
</body>
</html>
