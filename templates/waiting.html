<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Slides</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body style="{{ theme_style }}">
  <header class="topbar"><a class="brand" href="/">Slides</a></header>
  <main class="audience-shell">
    <section class="interaction waiting-state">
      <p class="status-pill">Not live yet</p>
      <h1>{{ title }}</h1>
      <p>The presenter has not started this presentation. Select “Check again” when they are ready.</p>
      <a class="button secondary" href="/{{ slug }}"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v6h-6"/></svg>Check again</a>
    </section>
  </main>
</body>
</html>
