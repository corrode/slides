<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a presentation · Slides</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Slides</a>
    <a class="button ghost small" href="/admin"><svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h14v12H5zM9 20h6M12 16v4"/></svg>Presenter</a>
  </header>
  <main class="shell">
    <div class="landing-grid landing-hero">
      <section>
        <p class="eyebrow">Interactive presentations</p>
        <h1>Join the room.</h1>
        <p class="landing-intro">Follow along, answer questions, and react from any browser.</p>
      </section>
      <section class="panel">
        <h2>Enter the presentation code</h2>
        <form method="post" action="/join">
          <label>Six-digit code
            <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="482731" required autofocus autocomplete="one-time-code">
          </label>
          <button type="submit">Join presentation<svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
