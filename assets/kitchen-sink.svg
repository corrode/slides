    </g>
    <g transform="translate(788 188)">
      <rect width="76" height="64" rx="20" fill="#3c3d3b"/>
      <text x="38" y="45">💡</text>
    </g>
    <g transform="translate(824 258)">
      <rect width="76" height="64" rx="20" fill="#3c3d3b"/>
      <text x="38" y="45">?</text>
    </g>
  </g>
